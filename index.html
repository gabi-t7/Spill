    body { margin: 0; background: #0f171e; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; overflow: hidden; font-family: monospace; }

#game-container { 
    display: flex; 
    flex-direction: row;

    gap: 20px; 
    max-height: 100vh; /* Prevent the whole page from growing */

/* 2. THE ANCHOR - This MUST be the only thing defining the height */
.game-anchor { 
    position: relative; 
    width: 360px !important; 
    height: 360px !important; 
    flex-shrink: 0; 
    overflow: hidden; 
    border: 4px solid #d1d1d6; 
    border-radius: 12px;
    z-index: 1; /* Keeps it above any ghost layers */
}

/* 3. THE CANVAS - Absolute keeps it from pushing the HUD */
#c {
    position: absolute !important;
    top: 0;
    left: 0;
    width: 100% !important; /* Forces it to fill the width of the anchor */
    height: auto !important; /* Let the aspect ratio handle the height */
    min-height: 100% !important; /* Ensures it at least fills the square */
    display: block;
    object-fit: cover; /* This is the magic: it prevents X or Y stretching */

    #missed { position: absolute; width: 100%; text-align: center; color: #ff4757; top: 35%; font-size: 80px; display: none; }

  @media (max-width: 700px) {

}

    /* 3. HUDs: Slimmer and stacked */

    { n: "LAVA", c: "#ff4500", delay: 100, mugs:[{w:60, h:75, s:0.9},  {w:155, h:20, s:1}, {w:50, h:55, s:0.7}, {w:65, h:45, s:0.8}, {w:155, h:10, s:1}, {w:55, h:55, s:0.7}, {w:50, h:65, s:0.8}, {w:100, h:10, s:1}, {w:45, h:65, s:0.9}, {w:170, h:15, s:1.3},  {w:75, h:40, s:0.9}, {w:70, h:45, s:0.8}, {w:65, h:55, s:0.7}, {w:155, h:20, s:1}, {w:45, h:85, s:0.7}, {w:60, h:45, s:0.7}, {w:45, h:65, s:0.9}, {w:155, h:10, s:1}, {w:55, h:55, s:0.8},  {w:75, h:40, s:0.8}, {w:60, h:55, s:0.8}, {w:100, h:20, s:1}, {w:55, h:65, s:0.8}, {w:155, h:15, s:1}, {w:55, h:55, s:0.9},  {w:75, h:40, s:0.8}, {w:60, h:55, s:0.9}, {w:150, h:10, s:1}, {w:75, h:65, s:0.8}, {w:75, h:45, s:0.7}, {w:150, h:20, s:0.7}, {w:45, h:65, s:0.9}, {w:55, h:65, s:0.7}], gc: "#1a0a05"},
    { n: "NUKE", c: "#39ff14", delay: 100, mugs: [{w:200, h:20, s:0.6}, {w:40, h:40, s:0.8}, {w:40, h:110, s:0.8}, {w:40, h:70, s:0.9}, {w:200, h:10, s:1.2}, {w:40, h:40, s:0.8}, {w:40, h:60, s:0.7},{w:200, h:10, s:0.8}, {w:40, h:40, s:0.9}, {w:200, h:20, s:0.8}, {w:40, h:70, s:0.9}, {w:200, h:10, s:1.2}, {w:40, h:50, s:0.8},{w:200, h:10, s:0.8}, {w:40, h:40, s:0.9}  ], gc: "#333333"}
 
];

let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=360;canvas.height=360;
// 1. Move the Teapot (b.y) higher up in the square
let b = { x: 180, y: 100, w: 70, h: 80, a: 0 }; 
ps=[],globalWaste=0,active=false,bps=[],spawnTimer=10,mugCount=0,lastPour=0,isDragging=false,saturation=0,targetA=0,currentLevel=1,levelMugsProcessed=0,levelTotalFill=0,levelTotalCap=0,shake=0;
let score=0, bestScore=parseInt(localStorage.getItem('spill_total_score'))||0;

if(ADMIN===1){ document.getElementById('dev-container').innerHTML = `<button id="dev-btn-style" onclick="skipLevel()">SKIP LEVEL</button>`; }

async function initGame() {
    // FIX: Re-sync bestScore on every init
    bestScore = parseInt(localStorage.getItem('spill_total_score')) || 0;
    document.getElementById('best-score').innerText = bestScore;

    if (sdk) { 
        try { 
            await sdk.init(); 
            updateLeaderboard(); 
        } catch (e) {} 
    }
    updateTheme(); 
    draw();
}

async function updateLeaderboard() {
    if(!sdk) return;
    try {
        const res = await sdk.leaderboard.getRecords('main', {limit:1});
        if(res.items && res.items.length){
            document.getElementById('world-label').style.display = 'inline';
            document.getElementById('world-score').innerText = res.items.score;
            document.getElementById('world-name').innerText = res.items.username;
        }
    } catch(e){}
}

function updateTheme() {
    const t = LevelConfigs[currentLevel - 1];
    
    // Fill the Start Menu Text
    const title = document.getElementById('ls-title');
    const theme = document.getElementById('ls-theme');
    if (title) title.innerText = `Level ${currentLevel}`;
    if (theme) theme.innerText = t.n;

    // Fill the Sidebar HUD
    const lvlInfo = document.getElementById('lvl-info');
    if (lvlInfo) lvlInfo.innerText = `${currentLevel} - ${t.n}`;
    
    // Set colors
    const container = document.getElementById('game-container');
    if (container) container.style.backgroundColor = t.gc;
    
    const startMenu = document.getElementById('level-start');
    if (startMenu) startMenu.style.display = 'flex';
    
    active = false;
}


function startLevel(){

	 const t = LevelConfigs[currentLevel-1];
    
	    // 1. Target the Container (The frame)
	    const container = document.getElementById('game-container');
	    if (container) {
		container.style.background = t.gc; // Use 'background' to override any gradients
		container.style.backgroundColor = t.gc;
	    }

	    // 2. Target the Canvas (The play area)
	    const c = document.getElementById('c');
	    if (c) {
		c.style.background = t.gc;
		c.style.backgroundColor = t.gc;
	    }
  
	document.getElementById('level-start').style.display='none';
	active=true;
	spawnTimer=1;
	if (currentLevel === 1 && !hasEverShownHint) {
	    hasEverShownHint = true; // Lock it instantly
	    const hint = document.getElementById('pour-hint');

	    if (hint) {
		// Step 1: Wait 2 seconds for the mug to settle
		setTimeout(() => {
		    hint.style.display = 'block';
		    setTimeout(() => { hint.style.opacity = '1'; }, 50);

		    // Step 2: Keep it visible for 4 seconds, then kill it
		    setTimeout(() => {
		        hint.style.transition = "opacity 1s"; // Slow, elegant fade
		        hint.style.opacity = "0";
		        
		        // Step 3: Remove from world after fade
		        setTimeout(() => { 
		            hint.style.display = 'none'; 
		        }, 1000);
		    }, 2000); 
		}, 1000);
	    }
	} 
	}

function createBP() {
    const lvl = LevelConfigs[currentLevel-1];
    if(mugCount >= lvl.mugs.length) return;
    const dna = lvl.mugs[mugCount];
    const autoCap = Math.floor((dna.w * dna.h) * 0.015);
    
    // FIXED: beltY is 320, so mug bottom must be 320
    let groundY = 320 - dna.h; 
    
    bps.push({
        x: -70, 
        y: groundY, 
        w: dna.w, 
        h: dna.h, 
        speed: dna.s, 
        cap: autoCap, 
        fill: 0, 
        proc: false, 
        perf: false, 
        forgive: 0
    });
    spawnTimer = lvl.delay; 
    mugCount++;
}


function handleLR() {
    const adj = document.getElementById('vibe-label').innerText;
    // If it's not a retry-worthy message, we move forward
    const isFail = (adj === "FAILED" || adj === "TOO MUCH SPILL!");

    if (!isFail) {
        if (currentLevel >= LevelConfigs.length) {
            document.getElementById('game-over').style.display = 'flex';
        } else {
            currentLevel++; // MOVE TO LEVEL 2
            resetLevel(currentLevel); 
        }
    } else {
        resetLevel(currentLevel); // RETRY LEVEL 1
    }
    document.getElementById('lr').style.display = 'none';
}

function skipLevel(){
    if(currentLevel >= LevelConfigs.length){
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over').style.display = 'flex';
    } else { currentLevel++; resetLevel(currentLevel); }
}

function resetLevel(lvl){
    currentLevel=lvl;mugCount=0;levelMugsProcessed=0;globalWaste=0;levelTotalFill=0;levelTotalCap=0;ps=[];bps=[];active=false;spawnTimer=10;shake=0;
    document.getElementById('missed').style.display='none';
    document.getElementById('w').innerText="0";
    document.getElementById('w').classList.remove('flash-red');
    updateTheme();
}

function showLR(eff,acc,waste,failed=false){
    active=false; displayLR(acc, waste, failed);
}

function displayLR(acc, waste, failed, customMsg = ""){
    const lr = document.getElementById('lr');
    lr.style.display = 'flex'; 

    const starsEl = document.getElementById('stars');
    const vibeEl = document.getElementById('vibe-label');
    const statsArea = document.getElementById('stats-area');
    const btn = document.getElementById('lr-btn');
    const title = document.getElementById('lr-title');

    let w = Math.floor(waste);
    document.getElementById('lr-acc').innerText = (acc >= 98 ? 100 : acc) + "%";
    document.getElementById('lr-waste').innerText = w + "ml";

    // THE FIX: Explicitly check for the 20ml fail condition first
    if (failed || w >= 20) {
        // KILL the success UI
        title.style.display = 'none';      
        starsEl.style.display = 'none';    
        statsArea.style.display = 'none';  
        
        // SHOW the fail UI
        vibeEl.innerText = (w >= 20) ? "TOO MUCH SPILL!" : "FAILED";
        vibeEl.style.display = 'block';
        btn.innerText = "RETRY";
    } 
    else {
        // SHOW the success UI
        title.style.display = 'block';
        starsEl.style.display = 'block';
        statsArea.style.display = 'block';
        btn.innerText = "CONTINUE";

        // Determine Stars (Only 3, 4, or 5)
        let s = "★★★☆☆", adj = "Good";
        if (w === 0) { s = "★★★★★"; adj = "Flawless!"; }
        else if (w <= 10) { s = "★★★★☆"; adj = "Groovy"; }

        starsEl.innerText = s;
        vibeEl.innerText = adj;
    }
}

function drawCyl(x,y,w,h,fV,cap,col,isP,angle=0){
    ctx.fillStyle="rgba(255,255,255,0.01)";
    ctx.beginPath();ctx.ellipse(x,y,w/2,8,0,Math.PI,0);ctx.lineTo(x+w/2,y+h);ctx.ellipse(x,y+h,w/2,12,0,0,Math.PI);ctx.lineTo(x-w/2,y);ctx.closePath();ctx.fill();
    let fh=(Math.min(fV,cap)/cap)*h;
    if(fV>0){
        ctx.save();
        ctx.beginPath();ctx.ellipse(x,y,w/2,8,0,Math.PI,0);ctx.lineTo(x+w/2,y+h);ctx.ellipse(x,y+h,w/2,12,0,0,Math.PI);ctx.lineTo(x-w/2,y);ctx.closePath();ctx.clip();
        ctx.fillStyle=col;
        if(isP){
            ctx.translate(x, y + h - fh);ctx.rotate(-angle);ctx.fillRect(-w, -5, w*2, h*2);
            ctx.beginPath(); ctx.ellipse(0, 0, w/2, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle="rgba(255,255,255,0.45)";ctx.beginPath(); ctx.ellipse(-w/6, -1, w/3, 3, 0, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.beginPath();ctx.ellipse(x,y+h-fh,w/2-2,6,0,Math.PI,0);ctx.lineTo(x+w/2-2,y+h);ctx.ellipse(x,y+h,w/2-2,10,0,0,Math.PI);ctx.lineTo(x-w/2+2,y+h-fh);ctx.closePath();ctx.fill();
        }
        ctx.restore();
    }
    ctx.strokeStyle="#4a4e50";ctx.lineWidth=isP?3:2;
    ctx.beginPath(); ctx.ellipse(x,y,w/2,8,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-w/2,y); ctx.lineTo(x-w/2,y+h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w/2,y); ctx.lineTo(x+w/2,y+h); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x,y+h,w/2,12,0,0,Math.PI); ctx.stroke();
    let g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
    g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(0.1,"rgba(255,255,255,0.25)"); 
    g.addColorStop(0.2,"rgba(255,255,255,0.05)"); g.addColorStop(0.8,"rgba(255,255,255,0.12)"); g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,w/2,8,0,Math.PI,0);ctx.lineTo(x+w/2,y+h);ctx.ellipse(x,y+h,w/2,12,0,0,Math.PI);ctx.lineTo(x-w/2,y);ctx.closePath();ctx.fill();
    if(fV>0 && !isP){
        ctx.fillStyle=col;
        ctx.beginPath(); ctx.ellipse(x, y+h-fh, w/2-2, 6, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.ellipse(x-w/6, y+h-fh-1, w/3, 3, 0, 0, Math.PI*2); ctx.fill();
    }
    if(!isP && fV > 0 && x > 0 && x < canvas.width){
        ctx.fillStyle = "#0f0"; ctx.font = "bold 14px monospace"; ctx.textAlign = "center";
        ctx.fillText(Math.min(100, Math.floor((fV/cap)*100)) + "%", x, y - 20);
    }
}

let lastTime = performance.now();

function draw() {
    let currentTime = performance.now();
    let dt = (currentTime - lastTime) / 16.0; 
    if (dt > 2) dt = 1;
    lastTime = currentTime;

    // 1. Fixed Clear: Clear BEFORE save to avoid stack ghosting
    ctx.clearRect(0, 0, 360, 360);
    
    const t = LevelConfigs[currentLevel-1];
    ctx.save(); 

    if(shake > 0) {
        ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2); 
        shake *= 0.9;
    }

    b.a += (targetA - b.a) * 0.15 * dt;
    let beltY = 320; 

    // Belt
    ctx.lineWidth = 14;
    let beltG = ctx.createLinearGradient(0, beltY - 7, 0, beltY + 7);
    beltG.addColorStop(0, "#1a1c1d"); beltG.addColorStop(0.5, "#4a4e50"); beltG.addColorStop(1, "#1a1c1d");
    ctx.strokeStyle = beltG;
    ctx.beginPath(); ctx.moveTo(0, beltY); ctx.lineTo(360, beltY); ctx.stroke();
    
    if(active){
        spawnTimer -= dt; 
        if(spawnTimer <= 0) createBP();
    }
    
    if(active && globalWaste > 19.9){ 
        active = false; isDragging = false; targetA = 0; shake = 25;
        document.getElementById('missed').style.display = 'block';
        setTimeout(() => {
            const acc = levelTotalCap > 0 ? Math.floor((levelTotalFill/levelTotalCap)*100) : 0;
            displayLR(acc, globalWaste, true, "TOO MUCH SPILL!");
        }, 800);
    }
    
    // Mugs
    bps.forEach(c => {
        if(active) c.x += c.speed * dt;
        drawCyl(c.x, c.y, c.w, c.h, c.fill, c.cap, t.c, false);

        if(c.fill >= c.cap && !c.perf){
            c.perf = true;
            levelMugsProcessed++; 
            // Update HUD only on change
            document.getElementById('mug-progress').innerText = levelMugsProcessed + " / " + t.mugs.length;
            
            if(currentLevel === 1) {
                document.getElementById('pf').style.display = 'block';
                setTimeout(() => document.getElementById('pf').style.display = 'none', 1000);
            }
        }
        
     // 2. MISS CHECK (Mug's back edge passed the teapot's right edge while empty)
if((c.x - c.w/2) > 215 && c.fill < c.cap && !c.proc){
    active = false; 
    shake = 25; 
    document.getElementById('missed').style.display = 'block';
    setTimeout(() => displayLR(Math.floor((c.fill/c.cap)*100), globalWaste, true), 500);
    c.proc = true;
}


        // 3. SUCCESS CHECK (Mug has passed the pouring zone)
// 3. SUCCESS CHECK (Mug's back edge has passed the teapot's right edge)
if((c.x - c.w/2) > 215 && !c.proc){
    c.proc = true;
    levelTotalFill += Math.min(c.cap, c.fill);
    levelTotalCap += c.cap;
    
    if(levelMugsProcessed === t.mugs.length) {
        // Wait for drops in flight to land
        const checkAir = setInterval(() => {
            if (ps.length === 0) { 
                clearInterval(checkAir);
                showLR(0, Math.floor((levelTotalFill/levelTotalCap)*100), globalWaste);
            }
        }, 50);
    }
}


    });

    // Teapot
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.a);
    drawCyl(0, -b.h/2 + 10, b.w, b.h - 20, 68, 100, t.c, true, b.a);
    ctx.restore();

    // Pouring Logic
    if(isDragging && b.a < -0.15 && active){
        let n = Date.now(); 
        saturation = Math.min(1, saturation + 0.04 * dt);
        let iv = Math.max(15, 120 - (Math.abs(b.a) * 100) - (saturation * 40));
        let cosA = Math.cos(b.a), sinA = Math.sin(b.a);
        let lipX = b.x + (-b.w/2 * cosA - (-b.h/2 + 10) * sinA);
        let lipY = b.y + (-b.w/2 * sinA + (-b.h/2 + 10) * cosA);
        
        ctx.fillStyle = t.c;
        ctx.beginPath(); ctx.arc(lipX, lipY, 7, 0, Math.PI * 2); ctx.fill();
        
        if(n - lastPour > iv){
            ps.push({x: lipX, y: lipY, startY: lipY, vx: b.a * 1.3, vy: t.n === "OIL" ? 0.15 : 0.25, life: 180, landed: false, p: false, inL: false});
            lastPour = n;
        }
    } else {
        saturation = Math.max(0, saturation - 0.05 * dt);
    }

    // Drop Physics
    let wasteChanged = false;
    for(let i = ps.length - 1; i >= 0; i--){
        let p = ps[i];
        if(!p.landed){
            let gravity = (t.n === "OIL" ? 0.15 : 0.25);
            p.vy += gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt;
            p.r = Math.min(14, 6 + (Math.abs(p.y - p.startY) / 25) * 8);

            for(let j = 0; j < bps.length; j++){
                let c = bps[j];
                let sY = c.y + c.h - ((c.fill / c.cap) * c.h);
                if(p.x > c.x - c.w/2 - 30 && p.x < c.x + c.w/2 + 30 && p.y > sY - 15 && p.y < c.y + c.h + 15){
                    if(c.fill < c.cap){ 
                        if(!p.inL){ c.fill += 1.5 * dt; p.inL = true; } 
                        ps.splice(i, 1); break; 
                    } else if(c.forgive < 8){
                        c.forgive++; ps.splice(i, 1); break; 
                    }
                }
            }
            if(p.y > beltY && !p.p){ 
                p.landed = true; p.y = beltY + 2; globalWaste += 1; p.p = true; 
                wasteChanged = true; // Flag for UI update
            }
        }
        
        ctx.fillStyle = t.c; 
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r || 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.45)"; 
        ctx.beginPath(); ctx.ellipse(p.x - (p.r || 5)/3, p.y - (p.r || 5)/3, (p.r || 5)/2, (p.r || 5)/4, Math.PI/4, 0, Math.PI*2); 
        ctx.fill();

        if(p.landed && (p.life -= dt) <= 0) ps.splice(i, 1);
    }

    // Only update spill HUD if a drop actually hit the floor
    if(wasteChanged) document.getElementById('w').innerText = Math.floor(globalWaste);

    ctx.restore(); 
    requestAnimationFrame(draw);
}

// CONTROLS
// --- UNIFIED INPUT ---
const handleStart = (e) => {
    if (e.cancelable) e.preventDefault();
    if (active) { isDragging = true; targetA = -0.8; }
};
const handleEnd = () => { isDragging = false; targetA = 0; };

function syncCanvasNoStretch() {
    const c = document.getElementById('c');
    // We stick to the "Fast" 640 height buffer. 
    // We don't use DPR here because object-fit:cover handles the 'smoothness' 
    // better on desktop/mobile without breaking your physics.
    c.width = 360;
    c.height = 640; 

    const ctx = c.getContext('2d');
    ctx.resetTransform(); // Ensure no leftover scales are active
}


function finalBoot() {
    // 1. Run the sync logic first
    syncCanvasNoStretch();

    const c = document.getElementById('c');
    ctx = c.getContext('2d'); 

    // RE-ATTACH INPUT TO THE SPECIFIC CANVAS
    c.onmousedown = c.ontouchstart = (e) => { 
        if(e.cancelable) e.preventDefault(); 
        if(active) { 
            isDragging = true; 
            targetA = -0.8; 
        } 
    };
    
    window.onmouseup = window.ontouchend = () => { 
        isDragging = false; 
        targetA = 0; 
    };

    active = false;
    // Teapot position remains identical to LANDSCAPE_WORKING
    b = { x: 180, y: 80, w: 70, h: 80, a: 0 }; 

    updateTheme(); 
    requestAnimationFrame(draw);
}

// EXECUTE BOOT
finalBoot();


</script>
